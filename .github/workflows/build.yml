name: Build Maestro AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Clean old files
        run: |
          rm -rf android
          rm -rf build
          rm -rf .dart_tool
      
      - name: Create fresh Android project
        run: |
          # إنشاء مجلد مؤقت
          mkdir -p /tmp/flutter_temp
          cd /tmp/flutter_temp
          
          # إنشاء مشروع Flutter جديد
          flutter create --platforms=android --org com.maestro.ai --project-name temp_app .
          
          # التحقق من وجود مجلد android
          echo "Contents of /tmp/flutter_temp:"
          ls -la /tmp/flutter_temp/
          
          echo "Android folder exists:"
          ls -la /tmp/flutter_temp/android/ || echo "Android folder not found"
          
          # نسخ مجلد android
          cd $GITHUB_WORKSPACE
          cp -r /tmp/flutter_temp/android .
          
          # تنظيف
          rm -rf /tmp/flutter_temp
          
          echo "✅ Android folder copied successfully"
          ls -la android/
      
      - name: Create MainActivity.kt
        run: |
          cat > android/app/src/main/kotlin/com/maestro/ai/MainActivity.kt << 'KOTLIN'
          package com.maestro.ai
          
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "maestro_ai/native"
              
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "executeCommand" -> {
                                  result.success(mapOf("success" to true))
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN
      
      - name: Create simplified pubspec.yaml
        run: |
          cat > pubspec.yaml << 'YAML'
          name: maestro_ai
          description: Maestro AI
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            path_provider: ^2.1.3
            flutter_animate: ^4.5.0
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
          YAML
      
      - name: Create simple main.dart
        run: |
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          
          void main() {
            runApp(const MyApp());
          }
          
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Maestro AI',
                debugShowCheckedModeBanner: false,
                home: const HomeScreen(),
              );
            }
          }
          
          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});
            
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(
                        Icons.mic,
                        size: 80,
                        color: Colors.blue,
                      ),
                      const SizedBox(height: 20),
                      const Text(
                        'Maestro AI',
                        style: TextStyle(
                          fontSize: 32,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 10),
                      Text(
                        'Voice Controlled Assistant',
                        style: TextStyle(
                          fontSize: 16,
                          color: Colors.grey[600],
                        ),
                      ),
                      const SizedBox(height: 40),
                      ElevatedButton(
                        onPressed: () {},
                        style: ElevatedButton.styleFrom(
                          padding: const EdgeInsets.symmetric(
                            horizontal: 40,
                            vertical: 15,
                          ),
                        ),
                        child: const Text(
                          'اضغط للتحدث',
                          style: TextStyle(fontSize: 18),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ai
          path: build/app/outputs/flutter-apk/*.apk
