name: Build Maestro AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Clean old files
        run: |
          rm -rf android
          rm -rf build
          rm -rf .dart_tool
      
      - name: Create fresh Android project
        run: |
          # إنشاء مشروع مؤقت في مسار مختلف
          mkdir -p /tmp/flutter_temp
          cd /tmp/flutter_temp
          flutter create --platforms=android --org com.maestro.ai --project-name maestro_temp .
          
          # التحقق من وجود مجلد android
          if [ -d "android" ]; then
            echo "✅ Android folder found"
            ls -la android/
          else
            echo "❌ Android folder not found!"
            ls -la
            exit 1
          fi
          
          # نسخ مجلد android إلى مسار العمل
          cd $GITHUB_WORKSPACE
          cp -r /tmp/flutter_temp/android .
          
          # تنظيف
          rm -rf /tmp/flutter_temp
          
          echo "✅ Android folder copied successfully"
      
      - name: Create simple pubspec.yaml
        run: |
          cat > pubspec.yaml << 'YAML'
          name: maestro_ai
          description: Maestro AI
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
          YAML
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ai
          path: build/app/outputs/flutter-apk/*.apk
