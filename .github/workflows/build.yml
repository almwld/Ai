name: Build Maestro AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Clean old android folder
        run: |
          rm -rf android
          rm -rf build
      
      - name: Create fresh Flutter project and copy android
        run: |
          # إنشاء مشروع مؤقت
          cd /tmp
          flutter create --platforms=android --org com.maestro.ai --project-name temp_maestro .
          
          # نسخ مجلد android إلى المشروع الأصلي
          cd $GITHUB_WORKSPACE
          cp -r /tmp/temp_maestro/android .
          
          # تنظيف
          rm -rf /tmp/temp_maestro
          
          echo "✅ Android folder created successfully"
      
      - name: Create MainActivity.kt
        run: |
          cat > android/app/src/main/kotlin/com/maestro/ai/MainActivity.kt << 'KOTLIN'
          package com.maestro.ai
          
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "maestro_ai/native"
              
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "executeCommand" -> {
                                  result.success(mapOf("success" to true))
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN
      
      - name: Update pubspec.yaml
        run: |
          # إزالة llama_cpp_dart
          sed -i '/llama_cpp_dart/d' pubspec.yaml || true
          
          # إضافة الحزم الأساسية فقط
          cat > pubspec.yaml << 'YAML'
          name: maestro_ai
          description: Maestro AI
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: '>=3.0.0 <4.0.0'
          
          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            path_provider: ^2.1.3
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
          YAML
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ai
          path: build/app/outputs/flutter-apk/*.apk
