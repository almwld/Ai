name: Build Maestro AI Professional

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Clean old build
        run: |
          rm -rf android
          rm -rf build
          rm -rf .dart_tool
      
      - name: Create Android project
        run: |
          cd /tmp
          flutter create --platforms=android --org com.maestro.ai --project-name maestro_temp .
          cd $GITHUB_WORKSPACE
          cp -r /tmp/maestro_temp/android .
          rm -rf /tmp/maestro_temp
          
          # Create MainActivity
          cat > android/app/src/main/kotlin/com/maestro/ai/MainActivity.kt << 'KOTLIN'
          package com.maestro.ai
          
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "maestro_ai/native"
              
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "executeCommand" -> {
                                  result.success(mapOf("success" to true))
                              }
                              "getDeviceInfo" -> {
                                  result.success(mapOf(
                                      "success" to true,
                                      "model" to android.os.Build.MODEL,
                                      "version" to android.os.Build.VERSION.RELEASE
                                  ))
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ai-professional
          path: build/app/outputs/flutter-apk/*.apk
