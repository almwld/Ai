name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4
      
      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      
      - name: تثبيت الحزم
        run: flutter pub get
      
      - name: بناء APK
        run: flutter build apk --release
      
      - name: إنشاء الإصدار
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Maestro AI v${{ github.event.inputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
