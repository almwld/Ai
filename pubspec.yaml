name: maestro_ai
description: Maestro AI - Voice Controlled Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  speech_to_text: ^6.6.2
  flutter_tts: ^3.8.5
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^6.0.0
  android_intent_plus: ^5.1.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
