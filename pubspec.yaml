name: maestro_ai
description: Maestro AI - مساعد شخصي ذكي يتحكم بالهاتف عبر الأوامر الصوتية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Voice & Speech - استخدام إصدارات متوافقة
  speech_to_text: ^6.1.1
  flutter_tts: ^3.8.5
  
  # UI/Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Utilities
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  android_intent_plus: ^4.0.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
